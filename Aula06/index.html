<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AULA 06</title>

</head>
<body>
    <!-- A Semântica no HTML significa usar as tags 
     certas para cada tipo de conteúdo, ajudando
     navegadores,mecanismos de busca e leitores de tela a
     entenderem melhor a estrutura da página -->

     <!-- Benefícios do HTML Semântico -->
      <!-- Melhora a acessibilidade (Leitores de tela conseguem intrepretar melhor)
     Melhora o SEO (O Google entende melhor a estrutura do site)
     Facilita a manutenção do código (código mais organizado e legível)
     Ajuda na responsividade (tags semânticas trabalham melhor com CSS e JS)
    -->
     <!-- SEM SEMÂNTICA -->
    <!---------------------------->
     <!-- <a hrfe="#">Ínicio</a>
     <a hrfe="#">Sobre</a>
     <p>Texto Principal do Site.</p>
     <p>Todos direitos reservados.</p> -->
    <!------------------------------>

    <!-- HTML SEMÂNYICO -->

    <header>
        <!-- O topo do site ou de uma sessão (Logo, título e menu de navegação) -->
        <nav>
        <!-- Contém links de navegação para outras partes do Site -->
            <a href="">Ínicio</a>
            <a href="">Sobre</a>
        </nav>
    </header>
    <main>
        <p>Texto Principal do Site.</p>
    </main>
    <footer>
        <p>Todos os Direitos reservados.</p>
    </footer>

</body>
</html>
