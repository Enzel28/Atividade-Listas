<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AULA 06</title>

</head>
<body>
    <!-- A Semântica no HTML significa usar as tags 
     certas para cada tipo de conteúdo, ajudando
     navegadores,mecanismos de busca e leitores de tela a
     entenderem melhor a estrutura da página -->

     <!-- Benefícios do HTML Semântico -->
      <!-- Melhora a acessibilidade (Leitores de tela conseguem intrepretar melhor)
     Melhora o SEO (O Google entende melhor a estrutura do site)
     Facilita a manutenção do código (código mais organizado e legível)
     Ajuda na responsividade (tags semânticas trabalham melhor com CSS e JS)
    -->
     <!-- SEM SEMÂNTICA -->
    <!---------------------------->
     <!-- <a hrfe="#">Ínicio</a>
     <a hrfe="#">Sobre</a>
     <p>Texto Principal do Site.</p>
     <p>Todos direitos reservados.</p> -->
    <!------------------------------>

    <!-- HTML SEMÂNYICO -->

    <header>
        <!-- O topo do site ou de uma sessão (Logo, título e menu de navegação) -->
        <nav>
        <!-- Contém links de navegação para outras partes do Site -->
            <a href="">Ínicio</a>
            <a href="">Sobre</a>
        </nav>
    </header>
    <main>
        <!-- Contém o o conteúdo principal da página -->
         <h1>Noticias AO VIVO do SESI</h1>

    <section>
        <!-- Usada para agrupar conteúdos relacionados dentro de uma página, geralmente com um título, indicando que fazem parte de um tema específico -->
         <h2>Últimas Notícias</h2>
        <p>Hoje foi anunciado um novo projeto.</p>

        <article>
        <!-- Representa um conteudo independente e autocontido, que pode ser distribuido ou reutilizado separadamente sem perder o sentido. EX: postagens BLOG, Noticias, comentários de usuários, cards de produtos, ou artigos de revista... -->
            <h3>Os Alunos amam ir para o SENAI</h3>
            <p>Descrição...</p>
        </article>
    </section>

    <aside>
        <!-- TAG usada para conteúdos secundários ou complementares, que não fazem parte do fluxo principal do cocumento. Normalmente, ela aparece como: 
         -Barras Laterais
         -Informações Adicionais
         -Anúncios
         -->
        <h3>Vídeos Recomendados</h3>
        <ul>
            <li>Como programar em HTML</li>
        </ul>
    </aside>

    <footer>
        <!-- Representa o rodapé da página, contendo informações como copyright e links secundários
         Quando usar? 
         - Final de página
         -->
         <p>😎67 AuraFarming 2026 - Todos os Direitos Reservados</p>
    </footer>

    </main>
    <footer>
        <p>Todos os Direitos reservados.</p>
    </footer>

</body>
</html>
