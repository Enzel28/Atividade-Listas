<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula07</title>
</head>
<body>
    <!-- TABELAS -->
    <!-- 
    <table> = Define a tabela
    <thead> = Define a região do Cabeçalho
    <tr> = Define uma linha da tabela
    <th> = Define um cabeçalho (deixa em negrito)
    <tbody> = Define a região do corpo
    <td> = Define uma célula (dados da tabela)
    border="1" = Adiciona as bordas na tela
    -->
    <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cidade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ana</td>
                <td>17</td>
                <td>Paris</td>
            </tr>
            <tr>
                <td>Enzo</td>
                <td>16</td>
                <td>Guarulhos</td>
            </tr>
        </tbody>
    </table>




</body>
</html>
